spring:
  application:
    name: angebot-pilot
  datasource:
    url: jdbc:h2:file:./data/angebotpilot;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

server:
  error:
    include-message: always

app:
  security:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:angebotpilot-local}
